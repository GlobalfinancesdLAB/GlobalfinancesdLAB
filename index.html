<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Global Finance SD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #0a0c12; /* fond de secours si l'image manque */
            font-family: 'Inter', system-ui, sans-serif;
            position: relative;
        }

        /* L'image en plein écran, fixe, en arrière-plan */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .social-dock {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
        }

        .dock-menu {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-end;
        }

        .dock-link {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(12, 18, 28, 0.7);
            backdrop-filter: blur(16px) saturate(180%);
            border-radius: 3rem;
            padding: 0.7rem 1.5rem 0.7rem 1.3rem;
            color: #f0f3fa;
            text-decoration: none;
            font-weight: 550;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            opacity: 0;
            animation: slideGlow 0.55s ease forwards;
        }

        .dock-link i {
            font-size: 1.4rem;
            transition: transform 0.25s ease;
        }

        @keyframes slideGlow {
            0% {
                opacity: 0;
                transform: translateX(40px) scale(0.92);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .dock-link:nth-child(1) { animation-delay: 0.05s; }
        .dock-link:nth-child(2) { animation-delay: 0.15s; }
        .dock-link:nth-child(3) { animation-delay: 0.25s; }

        .dock-link:hover {
            transform: translateX(-10px) scale(1.03);
            background: rgba(0, 0, 0, 0.85);
            border-color: rgba(255, 255, 255, 0.65);
        }

        .dock-link:hover i {
            transform: scale(1.12);
        }

        .link-x:hover {
            background: #0a0a0a;
            border-color: #1da1f2;
        }
        .link-x:hover i {
            color: #1da1f2;
        }

        .link-tg:hover {
            background: #0f2b36;
            border-color: #26a5e4;
        }
        .link-tg:hover i {
            color: #26a5e4;
        }

        @media (max-width: 640px) {
            .social-dock {
                bottom: 1.2rem;
                right: 1.2rem;
            }
            .dock-link {
                padding: 0.5rem 1.2rem;
                font-size: 0.75rem;
                gap: 0.6rem;
            }
            .dock-link i {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .dock-link {
                padding: 0.45rem 1rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <!-- Image d'arrière-plan : remplacez 'fond-mobile.png' si nécessaire -->
    <img class="bg-image" src="fond-mobile.png" alt="background" onerror="this.style.display='none'; document.body.style.backgroundColor='#0a0c12';">

    <div class="social-dock">
        <div class="dock-menu">
            <a href="https://x.com/GlobalFinanceSD" target="_blank" class="dock-link link-x">
                <i class="fab fa-twitter"></i>
                <span>X / Twitter</span>
            </a>
            <a href="https://t.me/GFannouncement" target="_blank" class="dock-link link-tg">
                <i class="fab fa-telegram-plane"></i>
                <span>Announcements</span>
            </a>
            <a href="https://t.me/GlobalFinanceSD" target="_blank" class="dock-link link-tg">
                <i class="fab fa-telegram-plane"></i>
                <span>Community</span>
            </a>
        </div>
    </div>
</body>
</html>
