<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Global Finance SD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background-image: url('fond-mobile.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #0a0c12; /* couleur de secours */
            font-family: 'Inter', system-ui, sans-serif;
        }
        .social-dock {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
        }
        .dock-menu {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-end;
        }
        .dock-link {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(12, 18, 28, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 3rem;
            padding: 0.7rem 1.5rem;
            color: #f0f3fa;
            text-decoration: none;
            font-weight: 550;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.35s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            opacity: 0;
            animation: slideGlow 0.55s forwards;
        }
        .dock-link i {
            font-size: 1.4rem;
        }
        @keyframes slideGlow {
            0% { opacity: 0; transform: translateX(40px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .dock-link:nth-child(1) { animation-delay: 0.05s; }
        .dock-link:nth-child(2) { animation-delay: 0.15s; }
        .dock-link:nth-child(3) { animation-delay: 0.25s; }
        .dock-link:hover {
            transform: translateX(-10px) scale(1.03);
            background: rgba(0, 0, 0, 0.85);
        }
        .link-x:hover { background: #0a0a0a; border-color: #1da1f2; }
        .link-x:hover i { color: #1da1f2; }
        .link-tg:hover { background: #0f2b36; border-color: #26a5e4; }
        .link-tg:hover i { color: #26a5e4; }
        @media (max-width: 640px) {
            .social-dock { bottom: 1rem; right: 1rem; }
            .dock-link { padding: 0.5rem 1rem; font-size: 0.75rem; gap: 0.6rem; }
            .dock-link i { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="social-dock">
        <div class="dock-menu">
            <a href="https://x.com/GlobalFinanceSD" target="_blank" class="dock-link link-x">
                <i class="fab fa-twitter"></i><span>X / Twitter</span>
            </a>
            <a href="https://t.me/GFannouncement" target="_blank" class="dock-link link-tg">
                <i class="fab fa-telegram-plane"></i><span>Announcements</span>
            </a>
            <a href="https://t.me/GlobalFinanceSD" target="_blank" class="dock-link link-tg">
                <i class="fab fa-telegram-plane"></i><span>Community</span>
            </a>
        </div>
    </div>
</body>
</html>
