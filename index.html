<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Finance SD - En construction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* L'image de fond : remplacez "votre-image.png" par le nom réel de votre fichier */
            background-image: url('votre-image.png');
            background-size: cover;      /* couvre tout l'écran */
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;

            /* Optionnel : assombrit très légèrement pour que le texte soit lisible */
            /* Vous pouvez supprimer ou ajuster l'opacité */
            background-color: #00000030;
            background-blend-mode: overlay;
        }

        /* Conteneur des petites écritures (en bas à droite ou centré bas) */
        .small-text {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 0.7rem;    /* petite écriture */
            font-weight: 500;
            color: #f0f0f0;
            text-align: right;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.2);
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        /* Lien "site en construction" en haut ou discret */
        .construction-badge {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #ffd966;
            z-index: 10;
            font-family: monospace;
            border-left: 3px solid #ffaa33;
        }

        /* Style des liens dans la zone "small-text" */
        .small-text a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px dotted #aaa;
            transition: 0.2s;
        }

        .small-text a:hover {
            color: #1da1f2;
            border-bottom-color: #1da1f2;
        }

        /* Sur mobile, on ajuste un peu */
        @media (max-width: 640px) {
            .small-text {
                font-size: 0.6rem;
                bottom: 12px;
                right: 12px;
                padding: 6px 12px;
            }
            .construction-badge {
                font-size: 0.6rem;
                top: 12px;
                left: 12px;
            }
        }

        /* Éviter que le texte ne gêne le clic sur les liens */
        .small-text a, .construction-badge {
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- Petit badge "site en construction" en haut à gauche -->
    <div class="construction-badge">
        🚧 SITE EN CONSTRUCTION 🚧
    </div>

    <!-- Zone des liens X et Telegram en bas à droite, très petits -->
    <div class="small-text">
        🔗 Suivez-nous : 
        <a href="https://x.com/GlobalFinanceSD" target="_blank" rel="noopener">X (Twitter)</a> &nbsp;|&nbsp;
        <a href="https://t.me/GFannouncement" target="_blank" rel="noopener">Annonces Telegram</a> &nbsp;|&nbsp;
        <a href="https://t.me/GlobalFinanceSD" target="_blank" rel="noopener">Groupe Telegram</a>
        <br>
        <span style="font-size:0.6rem; opacity:0.7;">globalfinancesd.com — bientôt prêt</span>
    </div>
</body>
</html>
